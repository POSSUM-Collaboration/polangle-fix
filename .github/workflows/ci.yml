name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  prek:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The mypy hook runs through uv
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: j178/prek-action@v2
        with:
          extra-args: --hook-stage manual --all-files

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [prek]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Test package
        run: >-
          uv run --locked pytest -ra --cov --cov-report=term --durations=20

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [prek]
    steps:
      # Full history so hatch-vcs can find the last tag
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl spice-racs-fix --help

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
